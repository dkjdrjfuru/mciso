# Netmask OS — kernel hardening (full edition)
# Debian bookworm already ships KASLR + KPTI + SMEP/SMAP + AppArmor support;
# this tunes the userspace-reachable attack surface.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
kernel.kexec_load_disabled = 1
net.core.bpf_jit_harden = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Deliberate RE posture (documented in SECURITY.md):
# ptrace for debuggers/attach workflows, perf for fuzzing/profiling.
kernel.yama.ptrace_scope = 0
kernel.perf_event_paranoid = -1
