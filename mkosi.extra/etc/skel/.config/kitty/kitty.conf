# ~/.config/kitty/kitty.conf — Netmask OS (hacker edition)

font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Netmask palette ---
foreground            #E0E0E0
background            #0D0D1A
selection_foreground  #E0E0E0
selection_background  #1E4D33
cursor                #27AE60
cursor_text_color     #0D0D1A
cursor_shape          beam
url_color             #00D9FF
url_style             curly

# subtle CRT scanline texture under the text (assets/scanlines.png)
background_image           /usr/share/backgrounds/netmask/scanlines.png
background_image_layout    tiled
background_image_opacity   0.35
background_image_linear    no

# 16-color palette (mandated netmask colors)
color0  #1A1A2E
color8  #4A4A6A
color1  #E94560
color9  #FF6B81
color2  #27AE60
color10 #6BFF9E
color3  #F39C12
color11 #FFC46B
color4  #3D9BFF
color12 #7FB8FF
color5  #B490F0
color13 #D0B3FF
color6  #00D9FF
color14 #7AEBFF
color7  #C8CBE0
color15 #F2F3FA

# --- behavior ---
scrollback_lines     10000
enable_audio_bell    no
visual_bell_duration 0.0
window_padding_width 10
confirm_os_window_close  0
placement_strategy   center
shell               zsh
repaint_delay       10
input_delay         2
sync_to_monitor     yes

# --- color emoji via Noto ---
symbol_map U+1F300-U+1FAFF,U+2600-U+26FF,U+2700-U+27BF Noto Color Emoji
