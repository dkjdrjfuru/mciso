# ~/.config/picom/picom.conf — Netmask OS
# Translucency + fades; no shadows/blur (fast on VMs, still hacker).

backend = "glx";
vsync = true;
glx-no-stencil = true;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

shadow = false;

blur-background = false;

# terminal slightly translucent, everything else solid
opacity-rule = [
    "94:class_g = 'kitty'",
    "96:class_g = 'Rofi'",
    "100:class_g = 'Burp Suite Community Edition'",
    "100:class_g = 'ghidra'"
];

inactive-dim = 0.08;
focus-exclude = [ "class_g = 'rofi'" ];

wintypes {
    tooltip = { fade = true; shadow = false; opacity = 0.92; focus = true; };
    notification = { fade = true; shadow = false; opacity = 0.95; focus = false; };
};
