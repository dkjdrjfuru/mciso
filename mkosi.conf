# Netmask OS — mkosi configuration (requires mkosi >= 24, tested with 27.1)
# FULL edition: minimal base + complete RE toolchain.
#
# Package lists live in ONE auditable place:
#   packages-full.txt                      (source of truth, version notes)
#   mkosi.conf.d/20-full-packages.conf     (generated by build.sh, committed)
# mkosi merges Packages= across drop-ins in lexical order.

[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86-64
# non-free: nikto · non-free-firmware: wifi/bt firmware for real laptops
Repositories=main contrib non-free non-free-firmware

[Output]
Output=netmask-os-rootfs
OutputDirectory=output
Format=directory

[Content]
CleanPackageMetadata=true
WithDocs=false
Hostname=netmask
Timezone=UTC
Locale=C.UTF-8
